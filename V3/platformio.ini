; Induction Heater Controller - PlatformIO / VSCode
; Board: Blue Pill built as the 128k CB part (same reason as the Arduino IDE
; board-target switch: the C8 flash size overflows).

[env:bluepill_f103cb]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

lib_deps =
    olikraus/U8g2 @ ^2.35.9

; Serial = USART1 (PA9 TX / PA10 RX) by default on the official STM32 core.
; If you were using USB CDC serial in the Arduino IDE, uncomment:
; build_flags =
;     -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
;     -D USBCON
